openapi: 3.0.0
info:
  title: Conformance API
  version: 1.0.0
  description: |
    Fixture API for Stage 3 conformance harness.
    Covers: valid request, missing required param, invalid body,
    unsupported Content-Type, unacceptable Accept, response media type,
    problem details / error semantics.
paths:
  /items:
    post:
      operationId: create_item
      summary: Create an item with strict validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '200':
          description: Item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    get:
      operationId: list_items
      summary: List items (no body)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Item list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemResponse'

  /items/{id}:
    get:
      operationId: get_item
      summary: Get item by path param
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Single item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'

  /echo:
    post:
      operationId: echo_body
      summary: Echo back request body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Echo response
          content:
            application/json:
              schema:
                type: object
                properties:
                  echo:
                    type: string

components:
  schemas:
    CreateItemRequest:
      type: object
      required:
        - name
        - quantity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        quantity:
          type: integer
          minimum: 0
          maximum: 10000
        tag:
          type: string
          enum: [normal, priority, archived]
        email:
          type: string
          format: email

    ItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        quantity:
          type: integer
